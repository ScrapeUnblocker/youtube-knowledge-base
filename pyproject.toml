[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-knowledge-base"
version = "0.1.0"
description = "Every new video from the YouTube channels you follow, saved to your Obsidian vault, Notion or a Qdrant vector database as a transcript note with chapters, timestamp links and the moments your terms are mentioned, plus a Slack, Discord or Telegram ping, on a GitHub Actions schedule."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "youtube",
    "youtube-transcript",
    "knowledge-base",
    "obsidian",
    "notion",
    "qdrant",
    "rag",
    "second-brain",
    "transcripts",
    "github-actions",
    "slack",
    "discord",
    "telegram-bot",
    "scrapeunblocker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "scrapeunblocker>=0.20,<1",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Repository = "https://github.com/ScrapeUnblocker/youtube-knowledge-base"
Issues = "https://github.com/ScrapeUnblocker/youtube-knowledge-base/issues"

[project.scripts]
youtube-knowledge-base = "youtube_knowledge_base.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["state", "vault"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
