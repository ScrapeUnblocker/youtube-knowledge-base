name: YouTube knowledge base

on:
  schedule:
    # Every day at 06:17 UTC. GitHub can start scheduled runs late, or drop one when busy.
    # Each run costs one API call per channel in config.yml, plus one per new video.
    # Twice a day: "17 6,18 * * *". Every 6 hours: "17 */6 * * *".
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what would be saved and sent, change nothing"
        type: boolean
        default: false

# contents: write lets the run commit the new notes (vault/) and the state file (state/).
permissions:
  contents: write

concurrency:
  group: youtube-knowledge-base
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_QDRANT: ${{ secrets.QDRANT_URL != '' }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - name: Check for the API key
        id: gate
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
        run: |
          if [ -z "$SCRAPEUNBLOCKER_KEY" ]; then
            echo "::notice title=Not set up yet::Add the SCRAPEUNBLOCKER_KEY repository secret (Settings > Secrets and variables > Actions) to start saving videos. Nothing was checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ "$HAS_QDRANT" = "true" ]; then
            python -m pip install ".[qdrant]"
          else
            python -m pip install .
          fi

      # The embedding model for Qdrant (local, no API key) is downloaded once and cached.
      - name: Cache the embedding model
        if: steps.gate.outputs.ready == 'true' && env.HAS_QDRANT == 'true'
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('config.yml') }}
          restore-keys: fastembed-

      - name: Save new videos
        if: steps.gate.outputs.ready == 'true'
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
          VAULT_GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: youtube-knowledge-base run $DRY_RUN_FLAG

      # The notes and state/videos.json (what was already saved) are committed back, so
      # the next run skips what it has seen. Runs even after a partial failure, so nothing
      # that was delivered is delivered twice.
      - name: Commit notes and state
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && !inputs.dry_run }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new videos; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save new videos [skip ci]"
          git pull --rebase
          git push
